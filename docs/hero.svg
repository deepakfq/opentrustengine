<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="20%" cy="30%" r="120%">
      <stop offset="0%" stop-color="#142342"/>
      <stop offset="60%" stop-color="#0c1a33"/>
      <stop offset="100%" stop-color="#060d1f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c14b"/>
      <stop offset="100%" stop-color="#b88420"/>
    </linearGradient>
    <linearGradient id="ringGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c97a"/>
      <stop offset="100%" stop-color="#0a8a4f"/>
    </linearGradient>
    <linearGradient id="ringIdle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2d4f"/>
      <stop offset="100%" stop-color="#15223e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.35"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#1d2c4d" stroke-width="1" opacity="0.35">
    <path d="M0 80 H1280 M0 160 H1280 M0 240 H1280 M0 320 H1280 M0 400 H1280 M0 480 H1280 M0 560 H1280"/>
    <path d="M80 0 V640 M160 0 V640 M240 0 V640 M320 0 V640 M400 0 V640 M480 0 V640 M560 0 V640 M640 0 V640 M720 0 V640 M800 0 V640 M880 0 V640 M960 0 V640 M1040 0 V640 M1120 0 V640 M1200 0 V640"/>
  </g>

  <!-- Decorative diagonal beams -->
  <g opacity="0.06">
    <path d="M-100 700 L500 -100 L700 -100 L100 700 Z" fill="#d4a017"/>
    <path d="M200 700 L800 -100 L900 -100 L300 700 Z" fill="#3b6cf0"/>
  </g>

  <!-- Left text block -->
  <g transform="translate(80, 170)">
    <!-- Wordmark -->
    <text x="0" y="0" font-size="64" font-weight="800" letter-spacing="-2" fill="#f8f9fc">
      <tspan fill="#9ca8c4" font-weight="400">Open</tspan><tspan fill="url(#gold)" font-weight="800">Trust</tspan><tspan fill="#f8f9fc" font-weight="800">Engine</tspan>
    </text>

    <!-- Underline accent -->
    <rect x="0" y="22" width="120" height="3" fill="url(#gold)" rx="1.5"/>

    <!-- Tagline lines -->
    <text x="0" y="86" font-size="22" font-weight="500" fill="#cdd5e8" letter-spacing="-0.2">
      Open multi-dimensional trust scoring
    </text>
    <text x="0" y="118" font-size="22" font-weight="500" fill="#cdd5e8" letter-spacing="-0.2">
      for commerce, workforce, and compliance.
    </text>

    <!-- Spec chips -->
    <g transform="translate(0, 175)" font-size="13" font-weight="600">
      <g transform="translate(0,0)">
        <rect width="138" height="32" rx="16" fill="#16223f" stroke="#2a3a64" stroke-width="1"/>
        <text x="69" y="21" fill="#a8b3d1" text-anchor="middle">AGPL + Commercial</text>
      </g>
      <g transform="translate(150,0)">
        <rect width="106" height="32" rx="16" fill="#16223f" stroke="#2a3a64" stroke-width="1"/>
        <text x="53" y="21" fill="#a8b3d1" text-anchor="middle">India-first</text>
      </g>
      <g transform="translate(268,0)">
        <rect width="124" height="32" rx="16" fill="#16223f" stroke="#2a3a64" stroke-width="1"/>
        <text x="62" y="21" fill="#a8b3d1" text-anchor="middle">BFSI-grade</text>
      </g>
      <g transform="translate(404,0)">
        <rect width="124" height="32" rx="16" fill="#16223f" stroke="#2a3a64" stroke-width="1"/>
        <text x="62" y="21" fill="#a8b3d1" text-anchor="middle">0–1200 score</text>
      </g>
    </g>

    <!-- Code preview -->
    <g transform="translate(0, 240)" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
      <rect width="540" height="120" rx="10" fill="#0a1426" stroke="#1d2c4d" stroke-width="1" filter="url(#shadow)"/>
      <text x="20" y="32" font-size="13" fill="#5d6c8e">$ npm install @ote/sdk</text>
      <text x="20" y="60" font-size="13" fill="#cdd5e8">
        <tspan fill="#7d6cf0">const</tspan> <tspan fill="#f0c14b">ote</tspan> = <tspan fill="#7d6cf0">new</tspan> <tspan fill="#22c97a">OpenTrustEngine</tspan>({...});
      </text>
      <text x="20" y="86" font-size="13" fill="#cdd5e8">
        <tspan fill="#5d6c8e">// 872 / 1200 · band ABB · trusted</tspan>
      </text>
      <text x="20" y="106" font-size="13" fill="#cdd5e8">
        <tspan fill="#7d6cf0">await</tspan> ote.<tspan fill="#22c97a">getProfile</tspan>(<tspan fill="#f0c14b">'company'</tspan>, id);
      </text>
    </g>
  </g>

  <!-- Right gauge block -->
  <g transform="translate(960, 320)">
    <!-- Outer halo -->
    <circle r="200" fill="#0e1a36" stroke="#1d2c4d" stroke-width="1" opacity="0.6"/>

    <!-- Track ring -->
    <circle r="155" fill="none" stroke="url(#ringIdle)" stroke-width="22"/>

    <!-- Score arc — 872/1200 = 72.7% of full circle. Use stroke-dasharray on a 155-radius circle -->
    <!-- Circumference 2*pi*155 ≈ 974. 72.7% = 708. -->
    <circle r="155" fill="none" stroke="url(#ringGreen)" stroke-width="22"
            stroke-dasharray="708 974" stroke-dashoffset="0"
            transform="rotate(-90)" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Tick marks at band cutoffs -->
    <g stroke="#3b4a72" stroke-width="2" opacity="0.7">
      <!-- 8 bands → ticks at 1100/1200, 1000/1200, etc -->
      <g transform="rotate(-90)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(330)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(300)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(270)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(210)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(150)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(90)"><line x1="135" y1="0" x2="178" y2="0"/></g>
      <g transform="rotate(-90) rotate(30)"><line x1="135" y1="0" x2="178" y2="0"/></g>
    </g>

    <!-- Big score number -->
    <text x="0" y="-10" text-anchor="middle" font-size="92" font-weight="800" fill="#f8f9fc" letter-spacing="-3">872</text>
    <text x="0" y="22" text-anchor="middle" font-size="18" font-weight="500" fill="#5d6c8e">of 1200</text>

    <!-- Band -->
    <g transform="translate(0,76)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="url(#gold)" filter="url(#shadow)"/>
      <text x="0" y="9" text-anchor="middle" font-size="22" font-weight="800" fill="#0c1a33" letter-spacing="3">ABB</text>
    </g>
    <text x="0" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#a8b3d1" letter-spacing="2">TRUSTED</text>
  </g>

  <!-- Bottom-right URL -->
  <text x="1200" y="600" text-anchor="end" font-size="14" font-weight="500" fill="#5d6c8e">opentrustengine.com</text>

  <!-- Bottom-left version -->
  <text x="80" y="600" font-size="14" font-weight="500" fill="#5d6c8e">v1.0 · AGPL-3.0 open source · commercial license available</text>
</svg>
