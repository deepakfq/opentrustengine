name: 🙋 Question
description: Have a usage question? Please post in Discussions instead.
title: "question: <short summary>"
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ### Please use [GitHub Discussions](https://github.com/deepakfq/opentrustengine/discussions) for usage questions

        The issue tracker is for bugs and feature requests. Discussions get faster, more thorough answers from maintainers and the community.

        If you're sure your question belongs as an issue, fill the box below.

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: I checked Discussions and existing issues first.
          required: true
