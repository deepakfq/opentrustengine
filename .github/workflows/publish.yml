name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish (sdk | widget | connectors)'
        required: true
        type: choice
        options:
          - sdk
          - widget
          - connectors

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'

      - name: Build & publish SDK
        if: ${{ github.event.inputs.package == 'sdk' || github.event_name == 'release' }}
        working-directory: packages/trust-sdk
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish Connectors
        if: ${{ github.event.inputs.package == 'connectors' || github.event_name == 'release' }}
        working-directory: packages/trust-connectors
        run: |
          npm install --no-audit --no-fund
          npx tsc
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build & publish Widget
        if: ${{ github.event.inputs.package == 'widget' || github.event_name == 'release' }}
        working-directory: packages/trust-widget
        run: |
          npm install --no-audit --no-fund
          npx rollup -c
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
