name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund --workspaces=false --include-workspace-root

      - name: Build SDK
        working-directory: packages/trust-sdk
        run: |
          npm install --no-audit --no-fund
          npx tsc

      - name: Build Connectors
        working-directory: packages/trust-connectors
        run: |
          npm install --no-audit --no-fund
          npx tsc

      - name: Build Widget
        working-directory: packages/trust-widget
        run: |
          npm install --no-audit --no-fund
          npx rollup -c
